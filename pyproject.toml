[project]
name = "atlassian-mcp"
version = "0.1.0"
description = "Read-only MCP server exposing Jira and Confluence operations to Claude."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Toby Rogers" }]
license = { text = "MIT" }
dependencies = [
    "mcp[cli]>=1.12,<2",
    "httpx>=0.27",
    "python-dotenv>=1.0",
]

[project.scripts]
atlassian-mcp = "atlassian_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/atlassian_mcp"]
